<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas · UrbanNexus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

<div class="page">

  <header class="page-header">
    <a href="{{ url_for('view.index') }}" class="back-btn">← Volver</a>
    <div class="page-title">
      <span class="eyebrow">UrbanNexus</span>
      <h1>Estadísticas climáticas</h1>
    </div>
  </header>

  {% if empty %}
  <div class="alert-empty">
    No hay datos disponibles en este momento.
  </div>
  {% endif %}

  <div class="graphs-grid">

    <div class="graph-card">
      <div class="card-header">
        <h3>Temperatura · °C</h3>
        <a href="{{ temp_img }}" download="temperatura.png" class="btn-download" title="Descargar gráfica">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Descargar
        </a>
      </div>
      <img src="{{ temp_img }}" alt="Gráfica de temperatura">
    </div>

    <div class="graph-card">
      <div class="card-header">
        <h3>Humedad · %</h3>
        <a href="{{ humidity_img }}" download="humedad.png" class="btn-download" title="Descargar gráfica">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Descargar
        </a>
      </div>
      <img src="{{ humidity_img }}" alt="Gráfica de humedad">
    </div>

    <div class="graph-card full-width">
      <div class="card-header">
        <h3>Viento · km/h</h3>
        <a href="{{ wind_img }}" download="viento.png" class="btn-download" title="Descargar gráfica">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Descargar
        </a>
      </div>
      <img src="{{ wind_img }}" alt="Gráfica de viento">
    </div>

  </div>

</div>

<!-- Modal lightbox -->
<div class="modal-overlay" id="modal" onclick="cerrarModal(event)">
  <div class="modal-content">
    <button class="modal-close" onclick="cerrarModal()">✕</button>
    <img id="modal-img" src="" alt="">
    <div class="modal-footer">
      <a id="modal-download" href="#" download class="btn-download">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Descargar gráfica
      </a>
    </div>
  </div>
</div>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>
<script>
  document.querySelectorAll(".graph-card img").forEach(img => {
    img.addEventListener("click", () => {
      const modalImg = document.getElementById("modal-img");
      const modalDownload = document.getElementById("modal-download");
      modalImg.src = img.src;
      modalImg.alt = img.alt;
      modalDownload.href = img.src;
      modalDownload.download = img.src.split("/").pop();
      document.getElementById("modal").classList.add("open");
    });
  });

  function cerrarModal(e) {
    if (!e || e.target === document.getElementById("modal") || e.currentTarget.classList.contains("modal-close")) {
      document.getElementById("modal").classList.remove("open");
    }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") cerrarModal();
  });
</script>

</body>
</html>
