<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>UrbanNexus | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cursor.css') }}">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <h1>Iniciar sesión</h1>
            <p class="subtitle">Accede con tu correo y contraseña</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flashes">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form id="loginForm" action="{{ url_for('auth.login') }}" method="POST">

                <div class="form-group">
                    <label for="id_empleado">ID de empleado</label>

                    <input type="text" id="id_empleado" name="id_empleado" placeholder="Ej: E4821T" required>

                    <small id="idEmpleadoError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <input type="password" id="password" name="password" placeholder="Tu contraseña" required>

                    <small id="passwordError"></small>
                </div>

                <button type="submit" class="primary-btn">
                    Entrar
                </button>

                <p class="bottom-text">
                    ¿No tienes cuenta?
                    <a href="{{ url_for('view.registro_usuario') }}">
                        Regístrate
                    </a>
                </p>

                <p class="bottom-text">
                    <a href="http://127.0.0.1:8000">← Volver a la página de inicio</a>
                </p>

            </form>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>
    <script src="{{ url_for('static', filename='js/cursor.js') }}"></script>
</body>

</html>
